name: vpi-pid

services:
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "${FRONTEND_HOST_PORT:-18731}:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: docker/backend.web.Dockerfile
    environment:
      DRAWING_STORAGE_DIR: /app/uploads
      PREVIEW_DIR: /app/previews
      TILE_DIR: /app/tiles
      PIPELINE_ARTIFACTS_DIR: /app/artifacts/pipeline
      PIPELINE_WEIGHTS: /app/models/symbol-detector/best.pt
      PIPELINE_DEVICE: cpu
      PIPELINE_OCR_DEVICE: cpu
      MAX_UPLOAD_BYTES: 104857600
    ports:
      - "${BACKEND_HOST_PORT:-18732}:8000"
    volumes:
      - ./uploads:/app/uploads
      - ./artifacts/previews:/app/previews
      - ./artifacts/tiles:/app/tiles
      - ./artifacts:/app/artifacts
      - ./artifacts/paddlex-models:/root/.paddlex
      - ./models:/app/models:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  worker:
    profiles: ["full-stack"]
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-pid_app}:${POSTGRES_PASSWORD:-change-this-password}@db:5432/${POSTGRES_DB:-pid_db}
      REDIS_URL: redis://redis:6379/0
      UPLOADS_DIR: /app/uploads
      ARTIFACTS_DIR: /app/artifacts
      MODELS_DIR: /app/models
    command: python -m app.workers.pipeline_worker
    volumes:
      - ./uploads:/app/uploads
      - ./artifacts:/app/artifacts
      - ./models:/app/models
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    profiles: ["full-stack"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pid_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-password}
      POSTGRES_DB: ${POSTGRES_DB:-pid_db}
    ports:
      - "127.0.0.1:${DATABASE_HOST_PORT:-18733}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    profiles: ["full-stack"]
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-18734}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
